<script>
// Clicks advance the introductions, station columns and camera pair, including
// their fragments. Keyboard navigation, including backwards, remains Reveal's own.
document.addEventListener("click", function (event) {
  const deck = window.Reveal;
  if (!deck || !deck.isReady() || deck.isOverview() || deck.isPaused()) return;
  if (!["opening", "advisor", "stations", "uncertainty", "hessian-hill"].includes(deck.getCurrentSlide()?.id)) return;
  if (event.button !== 0 || event.defaultPrevented ||
      event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const target = event.target;
  if (!(target instanceof Element) || !target.closest(".reveal")) return;
  if (target.closest("a, button, input, select, textarea, .controls, " +
                     "[contenteditable], .slide-menu, .speaker-notes")) return;
  event.preventDefault();
  deck.next();
});
</script>
