<script>
// Clicks reveal the opening poster, or advance the camera pair and its fragments. Keyboard navigation
// remains Reveal's own, including stepping backwards through the highlights.
document.addEventListener("click", function (event) {
  const deck = window.Reveal;
  if (!deck || !deck.isReady() || deck.isOverview() || deck.isPaused()) return;
  if (!["opening", "uncertainty", "hessian-hill"].includes(deck.getCurrentSlide()?.id)) return;
  if (event.button !== 0 || event.defaultPrevented ||
      event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const target = event.target;
  if (!(target instanceof Element) || !target.closest(".reveal")) return;
  if (target.closest("a, button, input, select, textarea, .controls, " +
                     "[contenteditable], .slide-menu, .speaker-notes")) return;
  event.preventDefault();
  deck.next();
});
</script>
